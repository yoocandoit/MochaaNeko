# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/catppuccin-mocha.conf

general {
  border_size = 2
  gaps_in = 5
  gaps_out = 10

  col.active_border = rgba(cdd6f4aa)
  col.inactive_border = rgba(595959aa)
}

decoration {
  rounding = 10
  rounding_power = 2
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.0
  dim_special = 0.8

  shadow {
    enabled = true
    range = 0
    render_power = 3

    color =  rgba(1a1a1aee)
    color_inactive = rgba(313244aa)
  }

  blur {
    enabled = true
    size = 6
    passes = 1
    vibrancy = 0.1696
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

# blur waybar
layerrule {
    name = waybar_blur
    match:namespace = waybar
    blur = on
    ignore_alpha = 0.4
}

# blur swaync
layerrule {
    name = swaync_blur
    match:namespace = swaync-(notification-window|control-center)
    blur = on
    ignore_alpha = 0.4
}

layerrule = blur on, animation poppin, ignore_alpha 0, match:namespace rofi

# rofi blur
windowrule = match:class rofi, opacity 0.75 0.75

